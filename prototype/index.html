<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Company CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: live 3D company site on the left, CRM workspace docked on the right; stacks on phones */
  --ink:#1d2830;
  --muted:#5d6b75;
  --paper:#ffffff;
  --wash:#f1f4f5;
  --line:#dbe2e6;
  --accent:#2c6a86;
  --ok:#2e8b57;
  --busy:#d99a1e;
  --late:#c2453b;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wash);color:var(--ink);font:14px/1.45 var(--body);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font:600 16px/1.2 var(--display);margin:0}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.pill{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#7a5a06;background:#fbf1d6;border-radius:999px;padding:3px 9px}
.btn{font:500 13px var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#235a72;color:#fff}

main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:linear-gradient(180deg,#e7eef1 0%,#d8e2e5 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;font:500 12px var(--body);cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(20,30,40,.14);will-change:transform}
.tag .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tag .lvl{font:500 11px var(--mono);color:var(--muted)}
.tag .flag{width:16px;height:16px;border-radius:50%;background:#f3c24e;color:#5a3f00;font:700 11px/16px var(--body);text-align:center}
.tag.hot,.tag:hover{border-color:var(--c);box-shadow:0 3px 10px rgba(20,30,40,.2);z-index:2}
.tag.active{background:var(--c);border-color:var(--c);color:#fff}
.tag.active .lvl{color:rgba(255,255,255,.85)}
.tag.active .dot{background:#fff}
.etag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:999px;font:500 11px/1.3 var(--body);cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(20,30,40,.14);will-change:transform}
.etag .ring{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--w);flex:none}
.etag .late{background:var(--late);color:#fff;border-radius:999px;font:600 10px/14px var(--mono);padding:0 5px}
.etag:hover,.etag.hot{z-index:3;border-color:var(--w);box-shadow:0 3px 8px rgba(20,30,40,.22)}
.etag.active{z-index:4;background:var(--ink);border-color:var(--ink);color:#fff}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:6px 10px;border-radius:8px;pointer-events:none}
.legend{position:absolute;right:14px;bottom:12px;display:flex;gap:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.9);padding:6px 10px;border-radius:8px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--w)}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

aside#panel{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.ph{padding:14px 20px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.ph .row1{display:flex;align-items:flex-start;gap:10px}
.ph .row1 > div{flex:1;min-width:0}
.crumbs{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
.crumbs button:hover{text-decoration:underline}
.ph h2{font:600 21px/1.2 var(--display);margin:4px 0 0;text-wrap:balance;display:flex;align-items:center;gap:10px}
.ph .role{font-size:13px;color:var(--muted);margin-top:1px}
.swatch{width:13px;height:13px;border-radius:3px;background:var(--c);flex:none}
.ph .status{margin:8px 0 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:2px;margin:0 -4px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px 9px;font:500 13px var(--body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.tabs button:hover{color:var(--ink)}
.pb{padding:16px 20px 32px;display:grid;gap:22px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font:600 18px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .v.late{color:var(--late)}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
section h3{font:600 13.5px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h3 small{font:400 11.5px var(--body);color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid #edf1f3;vertical-align:top}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.sub{color:var(--muted);font-size:11.5px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.chip.ok{background:#e1f2e8;color:#1f6640}
.chip.warn{background:#fbefd5;color:#855a05}
.chip.bad{background:#f8e0dd;color:#9a2f27}
.chip.info{background:#e1ebf6;color:#22558a}
.chip.muted{background:#eef1f3;color:#53606a}
.ref{font:500 11px var(--mono);background:#eef1f3;color:#3d4a53;border-radius:4px;padding:1px 6px;white-space:nowrap}
.rows{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.bar{height:9px;border-radius:5px;background:#edf1f3;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--c);border-radius:5px}
.list{display:grid;gap:8px}
.ditem{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}
.ditem:hover{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.ditem b{font:600 13.5px var(--display)}
.ditem .sub{grid-column:2}
.person{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}
.person:hover,.person.hot{border-color:var(--w);box-shadow:inset 3px 0 0 var(--w)}
.person .ring{width:12px;height:12px;border-radius:50%;border:3px solid var(--w)}
.person b{font-weight:600;font-size:13px}
.person .sub{grid-column:2}
.person .counts{grid-row:1 / span 2;grid-column:3;text-align:right;font:500 11.5px/1.5 var(--mono);color:var(--muted)}
.person .counts .l{color:var(--late)}
.group-h{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 2px}
.task{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:4px}
.task.late{border-color:#efc3bd;background:#fdf6f5}
.task .t{font-weight:500;font-size:13px}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:#b7c1c7}
.task .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.task .meta .due-late{color:var(--late);font-weight:600}
.task .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.task select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;max-width:100%}
form.assign{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
form.assign input,form.assign select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:0}
input,select{background:var(--paper);color:var(--ink);color-scheme:light}
input::placeholder{color:#8a969e;opacity:1}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(44,106,134,.15)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.item .acts{display:flex;gap:6px;margin-top:6px;align-items:center}
.feed{display:grid;gap:0}
.feed div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid #edf1f3;font-size:12.5px}
.feed .t{font:500 12px var(--mono);color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--wash);border-radius:8px;padding:10px 12px}
.note.msg{background:#e9f2f6;color:#1f4e63}
.prog{display:grid;gap:4px}
.prog .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{border:1px solid var(--line);border-radius:10px;padding:10px}
.zone .v{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.load{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#edf1f3}
.load i{display:block;height:100%}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

@media (max-width:860px){
  body{height:auto;min-height:100%;overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:60vh auto}
  aside#panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .ph{position:static}
  .hint{display:none}
}
@media (max-width:440px){
  .kpis,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zones{grid-template-columns:1fr}
  .brow{grid-template-columns:80px minmax(0,1fr) 84px}
  form.assign{grid-template-columns:1fr 1fr}
  form.assign input{grid-column:1 / -1}
  .legend{display:none}
}
</style>
</head>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <path d="M15 3 27 9.5v11L15 27 3 20.5v-11Z" fill="#2c6a86"/>
      <path d="M15 3 27 9.5 15 16 3 9.5Z" fill="#5fa0bd"/>
      <path d="M15 16v11l12-6.5v-11Z" fill="#1f4e63"/>
    </svg>
    <div>
      <h1>Company HQ</h1>
      <p>3D CRM prototype · Manager view</p>
    </div>
  </div>
  <span class="pill">Sample data</span>
  <span class="spacer"></span>
  <button class="btn" id="btnOverview" type="button">Whole building</button>

  <button class="btn" id="btnRotate" type="button" aria-pressed="false">Auto-rotate</button>

<main>

    <div id="labels"></div>

      <span><i style="--w:var(--late)"></i>Overdue tasks</span>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

const PORTS = ['Auckland','Singapore','Ho Chi Minh City','Osaka','Los Angeles'];
function fillTemplate(tpl){
  let ref = null;
  const t = tpl.replace(/\{(\w+)\}/g, (m, k) => {
    if (k === 'co') return pick(CUSTOMERS);
    if (k === 'camp') { const c = pick(DATA.marketing.campaigns.slice(0, 4)); ref = c.name.split(',')[0]; return c.name; }
    if (k === 'ship') { const s = pick(DATA.importExport.shipments.slice(0, 5)); ref = s.id; return s.id; }
    if (k === 'port') return pick(PORTS);
    if (k === 'so') { const n = 'SO-' + (9930 + Math.floor(rnd() * 60)); ref = n; return n.slice(3); }
    if (k === 'zone') return pick(['A', 'B', 'C']);
    if (k === 'dept') return pick(['Sales', 'Marketing', 'Finance', 'Import & Export', 'Warehouse']);
    return m;
  });
  return {t, ref};
}

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const PEOPLE = [];
let taskSeq = 1;
Object.entries(STAFF).forEach(([dept, cfg]) => {
  const n = cfg.list.length;
  cfg.list.forEach(([name, role], i) => {
    let presence = 'At desk';
    if (cfg.driver === name) presence = 'Driving forklift';
    else if (cfg.meet.includes(name)) presence = 'In a meeting';
    else if (i >= n - cfg.walk) presence = dept === 'warehouse' ? 'On the floor' : 'Away from desk';
    PEOPLE.push({id:slug(name), name, role, dept, presence, onSite:true, tasks:[]});
  });
  (cfg.offShift || []).forEach(([name, role]) => PEOPLE.push({id:slug(name), name, role, dept, presence:'Off shift', onSite:false, tasks:[]}));
});
PEOPLE.forEach(p => {
  (SPECIFIC[p.name] || []).forEach(([t, ref, s, d]) => p.tasks.push({id:'t' + taskSeq++, t, ref, s, d}));
  const target = p.onSite ? 3 + Math.floor(rnd() * 5) : 1 + Math.floor(rnd() * 2);
  let guard = 0;
  while (p.tasks.length < target && guard++ < 30) {
    const {t, ref} = fillTemplate(pick(TEMPLATES[p.dept]));
    if (p.tasks.some(x => x.t === t)) continue;
    const r = rnd();
    let s, d;
    if (r < 0.3) { s = 'done'; d = 13 + Math.floor(rnd() * 5); }
    else if (r < 0.6) { s = 'doing'; d = rnd() < 0.1 ? 13 + Math.floor(rnd() * 4) : 17 + Math.floor(rnd() * 8); }
    else { s = 'todo'; d = rnd() < 0.06 ? 14 + Math.floor(rnd() * 3) : 18 + Math.floor(rnd() * 14); }
    p.tasks.push({id:'t' + taskSeq++, t, ref, s, d});
  }
});
const personById = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const teamOf = dept => PEOPLE.filter(p => p.dept === dept);

const isLate = t => t.s !== 'done' && t.d < TODAY;
function workload(p){
  const open = p.tasks.filter(t => t.s !== 'done').length;
  const late = p.tasks.filter(isLate).length;
  const doneWeek = p.tasks.filter(t => t.s === 'done' && t.d >= WEEK_START).length;
  const state = late ? 'late' : open >= 6 ? 'busy' : 'ok';
  return {open, late, doneWeek, state, doing:p.tasks.filter(t => t.s === 'doing').length, todo:p.tasks.filter(t => t.s === 'todo').length};
}
const STATE = {ok:{label:'On track', color:'#2e8b57', chip:'ok'}, busy:{label:'Busy', color:'#d99a1e', chip:'warn'}, late:{label:'Has overdue tasks', color:'#c2453b', chip:'bad'}};

const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);

const short = n => {
  if (n >= 1e6) return 'A$' + (n / 1e6).toFixed(2).replace(/0$/, '') + 'M';
  if (n >= 1e3) return 'A$' + Math.round(n / 1e3) + 'K';
  return 'A$' + n;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function statusOf(id){
  switch(id){
    case 'sales': return {tone:'ok', chip:'On track', text: short(DATA.sales.won.value) + ' won this month'};
    case 'marketing': return {tone:'ok', chip:'On track', text: sum(DATA.marketing.campaigns, c => c.leads) + ' leads this month'};
    case 'finance': {
      const o = overdue();
      return {tone:'warn', chip:'Needs attention', text: short(sum(o, i => i.amt)) + ' overdue across ' + o.length + ' invoices'};
    }
    case 'management': {
      const n = waitingApprovals().length;
      return n ? {tone:'warn', chip:n + ' to approve', text: n + (n === 1 ? ' approval is' : ' approvals are') + ' waiting for you'}
               : {tone:'ok', chip:'All clear', text:'No approvals waiting'};
    }
    case 'import-export': {
      const held = DATA.importExport.shipments.filter(s => s.status === 'At customs');
      return held.length ? {tone:'warn', chip:'Needs attention', text: held.map(s => s.id).join(', ') + ' held at customs'}
                         : {tone:'ok', chip:'On track', text:'No shipments held'};
    }
    case 'warehouse': {
      const n = lowStock().length;
      return n ? {tone:'warn', chip:'Needs attention', text: n + ' products below reorder level'}
               : {tone:'ok', chip:'On track', text:'Stock above reorder levels'};
    }
  }
  return {tone:'muted', chip:'', text:''};
}

function personRow(p){
  const w = workload(p);
  return '<button class="person" type="button" data-emp="' + p.id + '" style="--w:' + STATE[w.state].color + '">' +
    '<span class="ring"></span><b>' + esc(p.name) + '</b>' +
    '<span class="counts">' + w.open + ' open' + (w.late ? '<br><span class="l">' + w.late + ' overdue</span>' : '<br>' + w.doneWeek + ' done this week') + '</span>' +
    '<span class="sub">' + esc(p.role) + ' · ' + esc(p.presence) + '</span>' +
  '</button>';
}
function renderTeam(d){
  const team = teamOf(d.id);
  const sorted = team.slice().sort((a, b) => { const wa = workload(a), wb = workload(b); return (wb.late - wa.late) || (wb.open - wa.open); });
  const onSite = sorted.filter(p => p.onSite), off = sorted.filter(p => !p.onSite);
  const open = sum(team, p => workload(p).open), late = sum(team, p => workload(p).late), done = sum(team, p => workload(p).doneWeek);
  const lateNames = sorted.filter(p => workload(p).late).map(p => p.name.split(' ')[0]);
  return '<div class="kpis">' + kpi('Open tasks', String(open), team.length + ' people') + kpi('Overdue', String(late), lateNames.length ? lateNames.slice(0, 3).join(', ') : 'none', late ? 'late' : '') + kpi('Done this week', String(done), 'since Mon 16 Nov') + '</div>' +
    '<section><h3>' + (d.id === 'warehouse' ? 'On shift now' : 'People') + ' <small>Overdue first</small></h3><div class="list">' + onSite.map(personRow).join('') + '</div></section>' +
    (off.length ? '<section><h3>Off shift <small>' + off.length + ' people</small></h3><div class="list">' + off.map(personRow).join('') + '</div></section>' : '') +
    '<div class="note">Click a person here or on the floor plan to see their tasks, assign new work or delegate. The seating is generated, not your real office layout.</div>';
}

function taskCard(p, t){
  const late = isLate(t);
  const due = t.s === 'done' ? 'Done ' + dayText(t.d) : late ? '<span class="due-late">Overdue · was due ' + dayText(t.d) + '</span>' : (t.d === TODAY ? 'Due today' : 'Due ' + dayText(t.d));
  let acts = '';
  if (t.s !== 'done') {
    if (S.delegating === t.id) {
      const mates = teamOf(p.dept).filter(m => m.id !== p.id);
      acts = '<label class="sub" for="deleg-' + t.id + '">Delegate to</label><select id="deleg-' + t.id + '">' + mates.map(m => '<option value="' + m.id + '">' + esc(m.name) + ' (' + workload(m).open + ' open)</option>').join('') + '</select>' +
        '<button class="btn sm primary" type="button" data-deleg-ok="' + t.id + '">Delegate</button><button class="btn sm" type="button" data-deleg-cancel>Cancel</button>';
    } else {
      acts = '<button class="btn sm" type="button" data-deleg="' + t.id + '">Delegate</button>';
    }
  }
  return '<div class="task' + (late ? ' late' : '') + (t.s === 'done' ? ' done' : '') + '">' +
    '<span class="t">' + esc(t.t) + '</span>' +
    '<span class="meta">' + due + (t.ref ? '<span class="ref">' + esc(t.ref) + '</span>' : '') + (t.from ? '<span>Delegated from ' + esc(t.from) + '</span>' : '') + (t.by ? '<span>Assigned by you</span>' : '') + '</span>' +
    (acts ? '<span class="acts">' + acts + '</span>' : '') +
  '</div>';
}
function renderEmployee(p){
  const d = byId[p.dept], w = workload(p);
  const order = (a, b) => (isLate(b) - isLate(a)) || (a.d - b.d);
  const doing = p.tasks.filter(t => t.s === 'doing').sort(order);
  const todo = p.tasks.filter(t => t.s === 'todo').sort(order);
  const done = p.tasks.filter(t => t.s === 'done').sort((a, b) => b.d - a.d);
  const group = (title, list, empty) => '<section><h3>' + title + ' <small>' + list.length + '</small></h3><div class="list">' + (list.length ? list.map(t => taskCard(p, t)).join('') : '<div class="sub">' + empty + '</div>') + '</div></section>';
  const first = p.name.split(' ')[0];
  const presTone = p.presence === 'Off shift' || p.presence === 'Away from desk' ? 'muted' : p.presence === 'In a meeting' ? 'info' : 'ok';
  const total = Math.max(1, w.open + p.tasks.filter(t => t.s === 'done').length);
  return '<div class="ph" style="--c:' + d.color + '">' +
      crumbs([{label:'Company HQ', go:''}, {label:d.name, go:d.id}, {label:p.name}]) +
      '<div class="row1"><div><h2><span class="swatch"></span>' + esc(p.name) + '</h2><div class="role">' + esc(p.role) + ' · ' + esc(d.name) + '</div></div>' +
      '<div class="acts"><button class="btn sm" type="button" data-msg>Message</button></div></div>' +
      '<div class="status">' + chip(presTone, p.presence) + chip(STATE[w.state].chip, STATE[w.state].label) + '</div>' +
    '</div>' +
    '<div class="pb" style="--c:' + d.color + '">' +
      (S.msgOpen ? '<div class="note msg">Messaging isn\'t connected yet. In the full app, this button opens a chat with ' + esc(first) + ' in your company\'s chat tool, such as Slack, Microsoft Teams or Zalo.</div>' : '') +
      (S.flash ? '<div class="note msg">' + esc(S.flash) + '</div>' : '') +
      '<div class="kpis four">' + kpi('In progress', String(w.doing)) + kpi('To do', String(w.todo)) + kpi('Overdue', String(w.late), null, w.late ? 'late' : '') + kpi('Done this week', String(w.doneWeek)) + '</div>' +
      '<div class="load" title="Task mix"><i style="width:' + (w.doing / total * 100) + '%;background:' + d.color + '"></i><i style="width:' + (w.todo / total * 100) + '%;background:#c7d1d7"></i><i style="width:' + ((total - w.open) / total * 100) + '%;background:#e3e9ec"></i></div>' +
      '<section><h3>Assign a task to ' + esc(first) + '</h3><form class="assign" data-assign="' + p.id + '">' +
        '<input id="new-task" name="title" type="text" placeholder="What needs doing?" aria-label="Task" required>' +
        '<select id="new-due" name="due" aria-label="Due date"><option value="17">Today</option><option value="18" selected>Tomorrow</option><option value="20">Friday</option><option value="24">Next week</option></select>' +
        '<button class="btn primary" type="submit">Assign</button></form></section>' +
      group('In progress', doing, 'Nothing in progress.') +
      group('To do', todo, 'Nothing waiting.') +
      group('Done', done, 'Nothing finished yet.') +
    '</div>';
}

function sparkline(vals, months, color){
  const W = 380, H = 128, p = {l:6, r:56, t:18, b:22};
  const lo = Math.min(...vals) * 0.92, hi = Math.max(...vals) * 1.04;
  const x = i => p.l + i * (W - p.l - p.r) / (vals.length - 1);
  const y = v => p.t + (H - p.t - p.b) * (1 - (v - lo) / (hi - lo));
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const base = H - p.b;
  const area = 'M' + x(0).toFixed(1) + ',' + base + ' L' + pts.join(' L') + ' L' + x(vals.length - 1).toFixed(1) + ',' + base + ' Z';
  const iMax = vals.indexOf(Math.max(...vals)), last = vals.length - 1;
  const grid = [0.25, 0.5, 0.75].map(f => { const yy = (p.t + (H - p.t - p.b) * f).toFixed(1); return '<line x1="' + p.l + '" x2="' + (W - p.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="#e6ebee" stroke-width="1"/>'; }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Monthly revenue, December 2025 to November 2026">' +
    grid + '<line x1="' + p.l + '" x2="' + (W - p.r) + '" y1="' + base + '" y2="' + base + '" stroke="#cfd8dd"/>' +
    '<path d="' + area + '" fill="' + color + '" fill-opacity=".14"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="' + x(iMax) + '" cy="' + y(vals[iMax]) + '" r="3" fill="' + color + '"/>' +
    '<text x="' + x(iMax) + '" y="' + (y(vals[iMax]) - 7) + '" text-anchor="middle">A$' + vals[iMax] + 'K</text>' +
    '<circle cx="' + x(last) + '" cy="' + y(vals[last]) + '" r="4.5" fill="#fff" stroke="' + color + '" stroke-width="2"/>' +
    '<text x="' + (x(last) + 8) + '" y="' + (y(vals[last]) + 4) + '">A$' + vals[last] + 'K</text>' +
    '<text x="' + p.l + '" y="' + (H - 6) + '">' + months[0] + ' 2025</text>' +
    '<text x="' + x(last) + '" y="' + (H - 6) + '" text-anchor="end">' + months[last] + ' (to date)</text>' +
  '</svg>';
}

function build3D(){

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
  const HOME = {target:new THREE.Vector3(1.5, 4.5, 2), offset:new THREE.Vector3(46, 40, 54), zoom:1};
  const PLAN_OFFSET = new THREE.Vector3(26, 58, 34);

  controls.target.copy(HOME.target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minZoom = 0.5;
  controls.maxZoom = 5;
  controls.minPolarAngle = 0.15;
  controls.maxPolarAngle = 1.32;
  controls.screenSpacePanning = true;
  controls.autoRotateSpeed = 0.7;
  controls.update();

  function textTexture(text, bg, fg, w, h, weight){

    const f = s => (weight || 600) + ' ' + s + 'px Sora, "Segoe UI", sans-serif';
    x.font = f(size);

  const WH = {x:11.5, z:-2.5, W:17, D:13, H:6.2};
  const wd = byId.warehouse;
  const wg = new THREE.Group(); wg.position.set(WH.x, 0, WH.z); scene.add(wg);
  const whTop = new THREE.Group(); wg.add(whTop); /* fascia and trusses, hidden in floor-plan mode */
  (function(){
    const {W, D, H} = WH;
    box(W, 0.3, D, M.concrete, 0, 0.15, 0, wg, false, true);
    box(W - 0.8, 0.02, 0.1, mat(0xe8c13a), 0, 0.31, 0.15, wg, false, false);
    box(W, H, 0.3, new THREE.MeshStandardMaterial({map:corrugated(W * 1.2), roughness:0.8}), 0, H / 2, -D / 2 + 0.15, wg, true, true);
    box(0.3, H, D, new THREE.MeshStandardMaterial({map:corrugated(D * 1.2), roughness:0.8}), -W / 2 + 0.15, H / 2, 0, wg, true, true);
    const fasc = mat(0xa3b4c0);
    box(W, 1.2, 0.3, fasc, 0, H - 0.6, D / 2 - 0.15, whTop, false, true);
    box(0.3, 1.2, D, fasc, W / 2 - 0.15, H - 0.6, 0, whTop, false, true);
    const band = mat(wd.color, {roughness:0.6});
    box(W + 0.02, 0.3, 0.1, band, 0, 0.15, D / 2 + 0.05, wg, false, false);
    box(0.1, 0.3, D + 0.02, band, W / 2 + 0.05, 0.15, 0, wg, false, false);
    [-W / 2 + 0.2, -2.8, 2.8, W / 2 - 0.2].forEach(x => box(0.3, H - 1.2, 0.3, M.column, x, (H - 1.2) / 2, D / 2 - 0.15, wg));
    [-D / 2 + 0.2, -2.2, 2.2].forEach(z => box(0.3, H - 1.2, 0.3, M.column, W / 2 - 0.15, (H - 1.2) / 2, z, wg));
    for (let z = -D / 2 + 1.8; z < D / 2; z += 2.6) box(W - 0.4, 0.16, 0.16, mat(0x6f7c86), 0, H - 0.15, z, whTop, false, false);
    const s = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 0.95), new THREE.MeshBasicMaterial({map:textTexture('WAREHOUSE', wd.color, '#fff', 640, 96)}));
    s.position.set(-3.6, H - 0.6, D / 2 + 0.01); whTop.add(s);

    const zoneX = [-5.6, 0, 5.6];
    DATA.warehouse.zones.forEach((z, zi) => {
      const cx = zoneX[zi];
      [-5.3, -3.0, -0.7].forEach(rz => {
        for (let k = 0; k <= 4; k++) {
          const ux = cx - 2.1 + k * 1.05;
          box(0.08, 4.6, 0.08, M.rack, ux, 2.6, rz - 0.45, wg, true, false);
          box(0.08, 4.6, 0.08, M.rack, ux, 2.6, rz + 0.45, wg, true, false);
        }
        [0.45, 1.6, 2.75, 3.9].forEach((ly, li) => {
          box(4.25, 0.1, 0.06, M.beam, cx, ly + 0.3, rz - 0.45, wg, false, false);
          box(4.25, 0.1, 0.06, M.beam, cx, ly + 0.3, rz + 0.45, wg, false, false);
          for (let b = 0; b < 4; b++) {
            if (r3() * 100 > z.fill) continue;
            const bx = cx - 1.575 + b * 1.05, base = ly + 0.35;
            box(0.9, 0.1, 0.85, M.pallet, bx, base + 0.05, rz, wg, false, false);
            const h = 0.5 + r3() * 0.4;
            box(0.82, h, 0.8, cartons[(b + li) % 3], bx, base + 0.1 + h / 2, rz, wg, true, false);
          }
        });
      });
      const lbl = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.8), new THREE.MeshBasicMaterial({map:textTexture('ZONE ' + z.name, null, '#5b4a1c', 512, 128, 700), transparent:true}));
      lbl.rotation.x = -Math.PI / 2; lbl.position.set(cx, 0.32, 1.0); wg.add(lbl);
    });
    [[-6.6, 4.8], [-5.4, 4.8], [-6.0, 3.6], [6.2, 4.6]].forEach(p => {
      box(1.0, 0.12, 1.0, M.pallet, p[0], 0.36, p[1], wg, false);
      cartonStack(wg, p[0], p[1], 2 + Math.floor(r3() * 2), 0.42);
    });
  })();

  const forklift = (function(){
    const f = new THREE.Group();
    box(1.4, 0.55, 0.95, M.yellow, 0, 0.6, 0, f);
    box(0.5, 0.4, 0.9, M.dark, -0.55, 0.95, 0, f);
    [[-0.45, 0.42], [0.45, 0.42], [-0.45, -0.42], [0.45, -0.42]].forEach(p => box(0.06, 1.0, 0.06, M.dark, p[0] * 0.6, 1.4, p[1], f, false));
    box(0.9, 0.06, 0.95, M.yellow, -0.05, 1.9, 0, f);
    box(0.08, 2.0, 0.08, M.dark, 0.78, 1.25, 0.3, f); box(0.08, 2.0, 0.08, M.dark, 0.78, 1.25, -0.3, f);
    box(0.9, 0.05, 0.12, M.leg, 1.2, 0.45, 0.25, f, false); box(0.9, 0.05, 0.12, M.leg, 1.2, 0.45, -0.25, f, false);
    box(0.9, 0.1, 0.8, M.pallet, 1.2, 0.53, 0, f, false);
    box(0.8, 0.7, 0.75, cartons[0], 1.2, 0.93, 0, f);
    [[-0.45, 0.5], [0.45, 0.5], [-0.45, -0.5], [0.45, -0.5]].forEach(p => { const w = mesh(cgeo(0.24, 0.24, 0.16, 12), M.tyre, p[0], 0.3, p[1], f); w.rotation.x = Math.PI / 2; });
    const driver = standing('#f08a24'); driver.scale.setScalar(0.8); driver.position.set(-0.2, 0.5, 0); f.add(driver);
    f.position.set(-5, 0.3, 2.4); wg.add(f);
    const dp = PEOPLE.find(p => p.presence === 'Driving forklift');
    if (dp) {
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:0x2e8b57, transparent:true, opacity:0.95, depthWrite:false}));
      ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; ring.scale.setScalar(2.2); ring.visible = false; f.add(ring);
      f.traverse(o => { if (o.isMesh && o !== ring) { o.userData.emp = dp.id; figPick.push(o); } });
      figs[dp.id] = {obj:f, ring, anchorY:2.4};
    }
    return {obj:f, dir:1, pause:0};
  })();
  teamOf('warehouse').filter(p => p.presence === 'On the floor').forEach(p => {
    const f = standing('#f08a24');
    const inAisle = r3() < 0.4;
    f.position.set(-4 + r3() * 9, 0.3, inAisle ? -1.85 : 3.6 + r3() * 2.2); wg.add(f);
    walkers.push(inAisle
      ? {obj:f, base:0.3, x0:-7.5, x1:7.5, z0:-1.95, z1:-1.75, tx:f.position.x, tz:f.position.z, wait:r3() * 2, speed:0.7 + r3() * 0.4, phase:r3() * 6}
      : {obj:f, base:0.3, x0:-4.2, x1:5.2, z0:3.4, z1:5.9, tx:f.position.x, tz:f.position.z, wait:r3() * 2, speed:0.8 + r3() * 0.4, phase:r3() * 6});
    tagFigure(p, f, 1.85);
  });

  (function(){
    const hit = new THREE.Mesh(bgeo(WH.W + 0.4, WH.H, WH.D + 0.4), hitMat);
    hit.position.set(0, WH.H / 2, 0); hit.userData.id = 'warehouse'; wg.add(hit); hitList.push(hit);
    const glow = new THREE.Mesh(bgeo(WH.W + 0.6, WH.H + 0.1, WH.D + 0.6), new THREE.MeshBasicMaterial({color:wd.color, transparent:true, opacity:0, depthWrite:false}));
    glow.position.set(0, WH.H / 2, 0); wg.add(glow);
    objs.warehouse = {group:wg, level:0, glow, center:new THREE.Vector3(WH.x, 2.6, WH.z), plan:new THREE.Vector3(WH.x, 1.2, WH.z + 0.8), planZoom:1.7,
      anchor:new THREE.Vector3(WH.x - 2, WH.H + 0.9, WH.z + WH.D / 2), align:'top'};
  })();

  function truck(stripe){
    const t = new THREE.Group();
    box(7, 2.6, 2.4, M.white, 0, 1.95, 0, t);
    box(7.02, 0.32, 2.42, mat(stripe, {roughness:0.6}), 0, 1.35, 0, t, false);
    box(8.4, 0.3, 2.0, M.dark, 0.6, 0.62, 0, t, false);
    box(1.8, 2.2, 2.3, mat(0x2c6a86, {roughness:0.5}), 4.45, 1.7, 0, t);
    box(0.06, 0.9, 2.0, mat(0x1a2228, {roughness:0.2}), 5.36, 2.15, 0, t, false);
    [-2.6, -1.5, 4.2].forEach(x => [1.1, -1.1].forEach(z => { const w = mesh(cgeo(0.46, 0.46, 0.34, 14), M.tyre, x, 0.46, z, t); w.rotation.x = Math.PI / 2; }));
    return t;
  }
  const dockTruck = truck(wd.color);
  dockTruck.position.set(WH.x + 4.2, 0.06, WH.z + WH.D / 2 + 3.8);
  dockTruck.rotation.y = -Math.PI / 2;
  scene.add(dockTruck);
  box(4.4, 0.06, 8.6, M.paving, WH.x + 4.2, 0.07, WH.z + WH.D / 2 + 4.3, scene, false, true);

  const traffic = [];
  const t1 = truck('#2f8f83'); t1.position.set(-40, 0.06, 17.6); scene.add(t1); traffic.push({obj:t1, v:5.5});
  const c1 = car(0xd9773a); c1.position.set(30, 0.06, 14.6); c1.rotation.y = Math.PI; scene.add(c1); traffic.push({obj:c1, v:-7});
  const c2 = car(0x6b5bb5); c2.position.set(-10, 0.06, 17.6); scene.add(c2); traffic.push({obj:c2, v:6.5});

  [[-21, -9], [-22, -2], [-21.5, 5], [-19, 11], [0.6, 6.5], [0.2, -9.5], [23, -9], [24, -2], [23.5, 5], [-12, -10], [6, -11.5], [16, -11]].forEach((p, k) => {
    const s = 0.85 + r3() * 0.5;
    mesh(cgeo(0.16 * s, 0.22 * s, 1.4 * s), M.trunk, p[0], 0.7 * s, p[1], scene);
    const top = mesh(new THREE.IcosahedronGeometry(1.25 * s, 0), k % 2 ? M.leaf : M.leaf2, p[0], 2.2 * s, p[1], scene);
    top.scale.y = 1.2; top.rotation.y = r3() * 3;
  });

  /* interaction */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let downAt = null, hoverId = null, hoverEmpId = null, mode = null;
  const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
  function pickAt(ev){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    if (mode) {
      const e = ray.intersectObjects(figPick, false).find(h => shown(h.object) && personById[h.object.userData.emp].dept === mode);
      if (e) return {emp:e.object.userData.emp};
    }
    const h = ray.intersectObjects(hitList, false).find(x => shown(x.object));
    return h ? {dept:h.object.userData.id} : {};
  }
  renderer.domElement.addEventListener('pointermove', ev => {
    if (ev.buttons) return;
    const p = pickAt(ev);
    setHoverEmp(p.emp || null);
    setHover(p.emp ? null : (p.dept && p.dept !== mode ? p.dept : null));
    renderer.domElement.style.cursor = (p.emp || (p.dept && p.dept !== mode)) ? 'pointer' : 'grab';
  });
  renderer.domElement.addEventListener('pointerleave', () => { setHover(null); setHoverEmp(null); });
  renderer.domElement.addEventListener('pointerdown', ev => { downAt = {x:ev.clientX, y:ev.clientY}; });
  renderer.domElement.addEventListener('pointerup', ev => {
    if (!downAt) return;
    const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y);
    downAt = null;
    if (moved >= 6) return;
    const p = pickAt(ev);
    if (p.emp) selectEmp(p.emp);
    else if (p.dept && p.dept !== mode) select(p.dept);
  });

  let tween = null;
  function flyTo(target, zoom, offset){
    const fromO = camera.position.clone().sub(controls.target);
    const toO = offset ? offset.clone() : fromO.clone();
    if (reduced) { controls.target.copy(target); camera.position.copy(target).add(toO); camera.zoom = zoom; camera.updateProjectionMatrix(); return; }
    tween = {t0:performance.now(), dur:850, fromT:controls.target.clone(), toT:target.clone(), fromZ:camera.zoom, toZ:zoom, fromO, toO};
  }
  function stepTween(now){
    if (!tween) return;
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(tween.fromT, tween.toT, e);
    const o = new THREE.Vector3().lerpVectors(tween.fromO, tween.toO, e);
    camera.position.copy(controls.target).add(o);
    camera.zoom = tween.fromZ + (tween.toZ - tween.fromZ) * e;
    camera.updateProjectionMatrix();
    if (k >= 1) tween = null;
  }
  function setMode(id){
    mode = id;
    const L = id ? byId[id].level : 0;
    DEPTS.filter(d => d.level).forEach(d => { objs[d.id].group.visible = !(L && d.level > L); });
    roof.visible = !L;
    whTop.visible = id !== 'warehouse';
    Object.entries(figs).forEach(([pid, f]) => { f.ring.visible = !!id && personById[pid].dept === id; });
  }

  function stepWalker(w, dt, t){
    const p = w.obj.position;
    if (w.wait > 0) { w.wait -= dt; p.y = w.base; return; }
    const dx = w.tx - p.x, dz = w.tz - p.z, dist = Math.hypot(dx, dz);
    if (dist < 0.05) { w.tx = w.x0 + r3() * (w.x1 - w.x0); w.tz = w.z0 + r3() * (w.z1 - w.z0); w.wait = 0.8 + r3() * 2.6; return; }
    const s = Math.min(dist, w.speed * dt);
    p.x += dx / dist * s; p.z += dz / dist * s;
    w.obj.rotation.y = Math.atan2(dx, dz);
    p.y = w.base + Math.abs(Math.sin(t * 9 + w.phase)) * 0.05;
  }
  function stepForklift(dt){
    const f = forklift;
    if (f.pause > 0) { f.pause -= dt; return; }
    f.obj.position.x += f.dir * 1.8 * dt;
    if (f.obj.position.x > 6.4 || f.obj.position.x < -6.4) {
      f.obj.position.x = Math.max(-6.4, Math.min(6.4, f.obj.position.x));
      f.dir *= -1; f.pause = 1.5;
    }
    f.obj.rotation.y = f.dir > 0 ? 0 : Math.PI;
  }

  const tmp = new THREE.Vector3();
  function place(el, v, align, w, h){
    tmp.copy(v).project(camera);
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    const off = x < -60 || x > w + 60 || y < -30 || y > h + 30;
    el.style.visibility = off ? 'hidden' : 'visible';
    el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) ' + (align === 'left' ? 'translate(-100%,-50%)' : 'translate(-50%,-100%)');
  }
  const wpos = new THREE.Vector3();
  function placeTags(){
    const w = stage.clientWidth, h = stage.clientHeight;
    DEPTS.forEach(d => {
      const o = objs[d.id], el = tags[d.id];
      if (!o) return;
      if (mode) { el.style.visibility = 'hidden'; return; }
      place(el, o.anchor, o.align, w, h);
    });
    Object.entries(etags).forEach(([id, el]) => {
      const f = figs[id];
      if (!f || mode !== personById[id].dept) { el.style.visibility = 'hidden'; return; }
      f.obj.getWorldPosition(wpos); wpos.y += f.anchorY;
      place(el, wpos, 'top', w, h);
    });
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (!reduced) {
      walkers.forEach(w => stepWalker(w, dt, t));
      stepForklift(dt);
      traffic.forEach(v => { v.obj.position.x += v.v * dt; if (v.obj.position.x > 70) v.obj.position.x = -70; if (v.obj.position.x < -70) v.obj.position.x = 70; });
    }
    stepTween(now);
    controls.update();
    DEPTS.forEach(d => {
      const o = objs[d.id]; if (!o) return;
      const target = mode ? (hoverId === d.id && d.id !== mode ? 0.1 : 0) : (hoverId === d.id ? 0.12 : 0);
      o.glow.material.opacity += (target - o.glow.material.opacity) * Math.min(1, dt * 10);
      o.glow.visible = o.glow.material.opacity > 0.004;
    });
    Object.entries(figs).forEach(([id, f]) => {
      if (!f.ring.visible) return;
      const sel = S.emp === id, hov = hoverEmpId === id;
      const base = id === 'dave-murphy' ? 2.2 : 1;
      const s = sel ? 1.35 + Math.sin(t * 5) * 0.12 : hov ? 1.25 : 1;
      f.ring.scale.setScalar(base * s);
    });
    renderer.render(scene, camera);
    placeTags();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    setHover(id){ hoverId = id; },
    setHoverEmp(id){ hoverEmpId = id; },
    enter(id, instant){
      setMode(id);
      if (!id) { if (!instant) flyTo(HOME.target, HOME.zoom, HOME.offset); return; }
      const o = objs[id];
      if (instant) { controls.target.copy(o.plan); camera.position.copy(o.plan).add(PLAN_OFFSET); camera.zoom = o.planZoom; camera.updateProjectionMatrix(); return; }
      flyTo(o.plan, o.planZoom, PLAN_OFFSET);
    },
    refreshPeople(){
      Object.entries(figs).forEach(([id, f]) => { f.ring.material.color.set(STATE[workload(personById[id]).state].color); });
    },
    reset(){ if (mode) { const o = objs[mode]; flyTo(o.plan, o.planZoom, PLAN_OFFSET); } else flyTo(HOME.target, HOME.zoom, HOME.offset); },
    autoRotate(on){ controls.autoRotate = on; }
  };
}
})();
</script>
</body>
